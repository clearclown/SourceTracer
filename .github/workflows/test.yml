name: Go Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: sourcetracer_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sourcetracer_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache-dependency-path: backend/go.sum

    - name: Install dependencies
      working-directory: ./backend
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        working-directory: ./backend
        args: --timeout=5m

    - name: Run unit tests
      working-directory: ./backend
      run: go test -v -short -race -coverprofile=coverage.txt -covermode=atomic ./...
      env:
        DATABASE_URL: postgresql://sourcetracer_test:test_password@localhost:5432/sourcetracer_test?sslmode=disable

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.txt
        flags: unittests
        name: codecov-umbrella

    - name: Run integration tests
      working-directory: ./backend
      run: go test -v -race -tags=integration ./...
      env:
        DATABASE_URL: postgresql://sourcetracer_test:test_password@localhost:5432/sourcetracer_test?sslmode=disable
        TEST_DATABASE_URL: postgresql://sourcetracer_test:test_password@localhost:5432/sourcetracer_test?sslmode=disable

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build CLI
      working-directory: ./backend
      run: go build -v -o bin/sourcetracer cmd/cli/main.go

    - name: Build API Server
      working-directory: ./backend
      run: go build -v -o bin/api-server cmd/api/main.go

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          backend/bin/sourcetracer
          backend/bin/api-server
